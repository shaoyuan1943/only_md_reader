<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      href="/src/assets/fonts/maple-mono-nf-cn/MapleMono-NF-CN-Regular.ttf"

    <link

      href="/src/assets/fonts/maple-mono-nf-cn/MapleMono-NF-CN-Bold.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <title>MD极简阅读</title>
    <style>
      :root {
        --boot-bg: #ede4d7;
        --boot-accent: #8a5a3c;
        --boot-glow: rgba(138, 90, 60, 0.2);
        background: var(--boot-bg);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --boot-bg: #151210;
          --boot-accent: #c28a63;
          --boot-glow: rgba(194, 138, 99, 0.22);
        }
      }

      :root[data-boot-theme="light"] {
        --boot-bg: #ede4d7;
        --boot-accent: #8a5a3c;
        --boot-glow: rgba(138, 90, 60, 0.2);
      }

      :root[data-boot-theme="dark"] {
        --boot-bg: #151210;
        --boot-accent: #c28a63;
        --boot-glow: rgba(194, 138, 99, 0.22);
      }

      body,
      #root {
        min-height: 100vh;
        margin: 0;
        background: var(--boot-bg);
      }

      #root {
        opacity: 0;
        transition: opacity 200ms ease;
      }

      body[data-app-ready="true"] #root {
        opacity: 1;
      }

      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 44%, var(--boot-glow), transparent 148px),
          var(--boot-bg);
        transition:
          opacity 200ms ease,
          visibility 200ms ease;
      }

      #boot-screen.boot-screen--leaving {
        opacity: 0;
        visibility: hidden;
      }

      .boot-mark {
        width: 68px;
        height: 68px;
        color: var(--boot-accent);
        animation: boot-breathe 1400ms ease-in-out infinite;
        opacity: 0.72;
        transform-origin: center;
      }

      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.985);
        }

        50% {
          opacity: 0.9;
          transform: scale(1.025);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #root,
        #boot-screen {
          transition: none;
        }

        .boot-mark {
          animation: none;
          opacity: 0.78;
          transform: none;
        }
      }
    </style>
  </head>

  <body>
